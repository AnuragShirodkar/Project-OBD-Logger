<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1580" viewBox="0 0 1200 1580">
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#526680"/></marker></defs>
<rect width="1200" height="1580" fill="#f1f5f9"/>
<rect width="1200" height="140" fill="#122640"/>
<g font-family="Arial,sans-serif"><text x="58" y="38" fill="#79e2ce" font-size="16" font-weight="700" text-anchor="start">SKILLLOGGER  /  FUNCTIONAL DESIGN</text><text x="56" y="90" fill="#fff" font-size="43" font-weight="700" text-anchor="start">OBD Logger working flow</text><text x="58" y="120" fill="#c9daeb" font-size="19" font-weight="400" text-anchor="start">Startup, OBD recording, safe shutdown and USB access</text><rect x="42" y="160" width="1116" height="465" rx="18" fill="#fff" stroke="#dbe5ef"/><text x="72" y="199" fill="#17665d" font-size="23" font-weight="700" text-anchor="start">01   Startup and PID selection</text><rect x="465" y="218" width="270" height="42" rx="21" fill="#107769" stroke="#107769"/><text x="600" y="245" fill="#fff" font-size="19" font-weight="700" text-anchor="middle">Power on</text><path d="M600 260V275" fill="none" stroke="#526680" stroke-width="2" marker-end="url(#arrow)"/><rect x="390" y="275" width="420" height="53" rx="10" fill="#eaf4fd" stroke="#8dbce5"/><text x="600" y="307.5" fill="#122640" font-size="19" font-weight="700" text-anchor="middle">Mount SD card and validate configuration</text><path d="M600 328V347" fill="none" stroke="#526680" stroke-width="2" marker-end="url(#arrow)"/><rect x="420" y="347" width="360" height="51" rx="10" fill="#d9eafc" stroke="#669fce"/><text x="600" y="378.5" fill="#122640" font-size="19" font-weight="700" text-anchor="middle">Can the logger open a log?</text><path d="M780 372H824" fill="none" stroke="#526680" stroke-width="2" marker-end="url(#arrow)"/><text x="790" y="360" fill="#122640" font-size="15" font-weight="400" text-anchor="start">No</text><rect x="824" y="343" width="295" height="60" rx="10" fill="#fce9ee" stroke="#e1a3b0"/><text x="971.5" y="367" fill="#752439" font-size="19" font-weight="700" text-anchor="middle">Show storage error</text><text x="971.5" y="391" fill="#752439" font-size="17" font-weight="400" text-anchor="middle">Stop without OBD requests</text><path d="M600 398V420" fill="none" stroke="#526680" stroke-width="2" marker-end="url(#arrow)"/><text x="612" y="413" fill="#122640" font-size="15" font-weight="400" text-anchor="start">Yes</text><rect x="454" y="420" width="292" height="48" rx="10" fill="#d9eafc" stroke="#669fce"/><text x="600" y="450" fill="#122640" font-size="19" font-weight="700" text-anchor="middle">Is config.json valid?</text><path d="M454 444H283V483" fill="none" stroke="#526680" stroke-width="2" marker-end="url(#arrow)"/><text x="348" y="433" fill="#122640" font-size="15" font-weight="400" text-anchor="start">Yes</text><path d="M746 444H916V483" fill="none" stroke="#526680" stroke-width="2" marker-end="url(#arrow)"/><text x="817" y="433" fill="#122640" font-size="15" font-weight="400" text-anchor="start">No</text><rect x="94" y="483" width="378" height="73" rx="10" fill="#eaf4fd" stroke="#8dbce5"/><text x="283" y="501.5" fill="#122640" font-size="19" font-weight="700" text-anchor="middle">Use configured CAN settings</text><text x="283" y="525.5" fill="#122640" font-size="17" font-weight="400" text-anchor="middle">Discover support; skip only requests</text><text x="283" y="549.5" fill="#122640" font-size="17" font-weight="400" text-anchor="middle">confirmed unsupported by all ECUs</text><rect x="727" y="483" width="378" height="73" rx="10" fill="#fff1d8" stroke="#deb576"/><text x="916" y="501.5" fill="#643b0d" font-size="19" font-weight="700" text-anchor="middle">Show NO CONFIG or BAD CONFIG</text><text x="916" y="525.5" fill="#643b0d" font-size="17" font-weight="400" text-anchor="middle">Use 500 kbps / 11-bit CAN</text><text x="916" y="549.5" fill="#643b0d" font-size="17" font-weight="400" text-anchor="middle">Discover confirmed Mode 01 live PIDs</text><path d="M283 556V572H454V584" fill="none" stroke="#526680" stroke-width="2" marker-end="url(#arrow)"/><path d="M916 556V572H746V584" fill="none" stroke="#526680" stroke-width="2" marker-end="url(#arrow)"/><rect x="390" y="584" width="420" height="28" rx="10" fill="#d9eafc" stroke="#669fce"/><text x="600" y="604" fill="#122640" font-size="19" font-weight="700" text-anchor="middle">Any requests to poll?</text><path d="M810 598H831" fill="none" stroke="#526680" stroke-width="2" marker-end="url(#arrow)"/><rect x="831" y="581" width="231" height="33" rx="10" fill="#fce9ee" stroke="#e1a3b0"/><text x="946.5" y="603.5" fill="#752439" font-size="19" font-weight="700" text-anchor="middle">No → Save reason &amp; close</text><rect x="42" y="648" width="1116" height="459" rx="18" fill="#fff" stroke="#dbe5ef"/><text x="72" y="687" fill="#17665d" font-size="23" font-weight="700" text-anchor="start">02   Recording loop</text><path d="M600 612V706" fill="none" stroke="#526680" stroke-width="2" marker-end="url(#arrow)"/><text x="614" y="642" fill="#122640" font-size="15" font-weight="400" text-anchor="start">Yes</text><rect x="390" y="707" width="420" height="52" rx="10" fill="#eaf4fd" stroke="#8dbce5"/><text x="600" y="739" fill="#122640" font-size="19" font-weight="700" text-anchor="middle">Select the next due request</text><path d="M600 759V777" fill="none" stroke="#526680" stroke-width="2" marker-end="url(#arrow)"/><rect x="390" y="777" width="420" height="52" rx="10" fill="#eaf4fd" stroke="#8dbce5"/><text x="600" y="809" fill="#122640" font-size="19" font-weight="700" text-anchor="middle">Send request and wait for replies or timeout</text><path d="M600 829V847" fill="none" stroke="#526680" stroke-width="2" marker-end="url(#arrow)"/><rect x="390" y="847" width="420" height="59" rx="10" fill="#eaf4fd" stroke="#8dbce5"/><text x="600" y="870.5" fill="#122640" font-size="19" font-weight="700" text-anchor="middle">Log TX, captured RX, results and faults</text><text x="600" y="894.5" fill="#122640" font-size="17" font-weight="400" text-anchor="middle">RX capture is scoped to the active request</text><path d="M600 906V924" fill="none" stroke="#526680" stroke-width="2" marker-end="url(#arrow)"/><rect x="390" y="924" width="420" height="51" rx="10" fill="#d9eafc" stroke="#669fce"/><text x="600" y="955.5" fill="#122640" font-size="19" font-weight="700" text-anchor="middle">Would the next write exceed 250 MB?</text><path d="M810 950H978V974" fill="none" stroke="#526680" stroke-width="2" marker-end="url(#arrow)"/><rect x="852" y="974" width="252" height="57" rx="10" fill="#eaf4fd" stroke="#8dbce5"/><text x="978" y="996.5" fill="#122640" font-size="19" font-weight="700" text-anchor="middle">Open the next log file</text><text x="978" y="1020.5" fill="#122640" font-size="17" font-weight="400" text-anchor="middle">after closing this one</text><text x="831" y="938" fill="#122640" font-size="15" font-weight="400" text-anchor="start">Yes</text><path d="M978 1031V1061H810" fill="none" stroke="#526680" stroke-width="2" marker-end="url(#arrow)"/><path d="M600 975V1034" fill="none" stroke="#526680" stroke-width="2" marker-end="url(#arrow)"/><text x="610" y="1005" fill="#122640" font-size="15" font-weight="400" text-anchor="start">No</text><rect x="390" y="1034" width="420" height="54" rx="10" fill="#d9eafc" stroke="#669fce"/><text x="600" y="1067" fill="#122640" font-size="19" font-weight="700" text-anchor="middle">Stop condition reached?</text><path d="M390 1061H350V734H390" fill="none" stroke="#526680" stroke-width="2" marker-end="url(#arrow)"/><text x="358" y="1048" fill="#122640" font-size="15" font-weight="400" text-anchor="start">No</text><rect x="73" y="772" width="260" height="86" rx="10" fill="#eaf4fd" stroke="#8dbce5"/><text x="203" y="797" fill="#122640" font-size="19" font-weight="700" text-anchor="middle">Mode 04 button</text><text x="203" y="821" fill="#122640" font-size="17" font-weight="400" text-anchor="middle">Send at the next safe</text><text x="203" y="845" fill="#122640" font-size="17" font-weight="400" text-anchor="middle">opportunity and log the result</text><rect x="73" y="877" width="260" height="89" rx="10" fill="#eaf4fd" stroke="#8dbce5"/><text x="203" y="903.5" fill="#122640" font-size="19" font-weight="700" text-anchor="middle">ECU misses a reply</text><text x="203" y="927.5" fill="#122640" font-size="17" font-weight="400" text-anchor="middle">Record the missing reply.</text><text x="203" y="951.5" fill="#122640" font-size="17" font-weight="400" text-anchor="middle">Continue if others respond.</text><rect x="837" y="756" width="283" height="149" rx="10" fill="#fff1d8" stroke="#deb576"/><text x="978.5" y="788.5" fill="#643b0d" font-size="19" font-weight="700" text-anchor="middle">Stop triggers</text><text x="978.5" y="812.5" fill="#643b0d" font-size="17" font-weight="400" text-anchor="middle">User stop or duration ends</text><text x="978.5" y="836.5" fill="#643b0d" font-size="17" font-weight="400" text-anchor="middle">ECU link lost or logging fault</text><text x="978.5" y="860.5" fill="#643b0d" font-size="17" font-weight="400" text-anchor="middle">Firmware update requested</text><text x="978.5" y="884.5" fill="#643b0d" font-size="17" font-weight="400" text-anchor="middle">Vehicle power lost (planned)</text><rect x="42" y="1130" width="1116" height="405" rx="18" fill="#fff" stroke="#dbe5ef"/><text x="72" y="1169" fill="#17665d" font-size="23" font-weight="700" text-anchor="start">03   Save, close and hand off</text><path d="M600 1088V1186" fill="none" stroke="#526680" stroke-width="2" marker-end="url(#arrow)"/><text x="613" y="1122" fill="#122640" font-size="15" font-weight="400" text-anchor="start">Yes</text><rect x="376" y="1186" width="448" height="56" rx="10" fill="#eaf4fd" stroke="#8dbce5"/><text x="600" y="1220" fill="#122640" font-size="19" font-weight="700" text-anchor="middle">Stop sending OBD requests</text><path d="M600 1242V1261" fill="none" stroke="#526680" stroke-width="2" marker-end="url(#arrow)"/><rect x="376" y="1261" width="448" height="56" rx="10" fill="#eaf4fd" stroke="#8dbce5"/><text x="600" y="1295" fill="#122640" font-size="19" font-weight="700" text-anchor="middle">Drain buffered data, flush and close log</text><path d="M600 1317V1336" fill="none" stroke="#526680" stroke-width="2" marker-end="url(#arrow)"/><rect x="376" y="1336" width="448" height="52" rx="10" fill="#d9eafc" stroke="#669fce"/><text x="600" y="1368" fill="#122640" font-size="19" font-weight="700" text-anchor="middle">USB file access available?</text><path d="M376 1362H211V1410" fill="none" stroke="#526680" stroke-width="2" marker-end="url(#arrow)"/><path d="M824 1362H965V1410" fill="none" stroke="#526680" stroke-width="2" marker-end="url(#arrow)"/><text x="283" y="1351" fill="#122640" font-size="15" font-weight="400" text-anchor="start">Yes</text><text x="910" y="1351" fill="#122640" font-size="15" font-weight="400" text-anchor="start">No</text><rect x="73" y="1410" width="276" height="68" rx="10" fill="#eaf4fd" stroke="#8dbce5"/><text x="211" y="1438" fill="#122640" font-size="19" font-weight="700" text-anchor="middle">Copy logs or replace JSON</text><text x="211" y="1462" fill="#122640" font-size="17" font-weight="400" text-anchor="middle">Restart to start another run</text><rect x="839" y="1410" width="252" height="68" rx="34" fill="#107769" stroke="#107769"/><text x="965" y="1438" fill="#fff" font-size="19" font-weight="700" text-anchor="middle">Recording stopped</text><text x="965" y="1462" fill="#fff" font-size="17" font-weight="400" text-anchor="middle">Report the outcome</text><rect x="850" y="1182" width="270" height="130" rx="10" fill="#fff1d8" stroke="#deb576"/><text x="985" y="1205" fill="#643b0d" font-size="19" font-weight="700" text-anchor="middle">Power-loss path · planned</text><text x="985" y="1229" fill="#643b0d" font-size="17" font-weight="400" text-anchor="middle">Use USB if available.</text><text x="985" y="1253" fill="#643b0d" font-size="17" font-weight="400" text-anchor="middle">Otherwise use battery.</text><text x="985" y="1277" fill="#643b0d" font-size="17" font-weight="400" text-anchor="middle">Cut backup after save</text><text x="985" y="1301" fill="#643b0d" font-size="17" font-weight="400" text-anchor="middle">or at hardware timeout.</text><text x="58" y="1563" fill="#526680" font-size="16" font-weight="400" text-anchor="start">Design review draft  ·  Firmware programming and Recovery follow a separate flow.</text></g></svg>
